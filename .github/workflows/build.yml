name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller and Pillow
        run: pip install pyinstaller pillow
      - name: Build EXE
        run: pyinstaller --noconsole --onefile --icon=assets/icon.ico --add-data "assets;assets" --name Ben10Remastered launcher.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Ben10Remastered-Windows
          path: dist/Ben10Remastered.exe
          
